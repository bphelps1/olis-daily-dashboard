<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLIS Daily Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <header class="app-header border-bottom">
    <div class="container-fluid py-2 d-flex flex-wrap align-items-center gap-3">
      <h1 class="h5 mb-0 me-auto">🏛️ OLIS Daily Dashboard</h1>

      <div class="d-flex align-items-center gap-2">
        <label class="form-label mb-0 small text-muted">Session</label>
        <select id="session" class="form-select form-select-sm" style="width:auto">
          <option value="auto" selected>Auto (by date)</option>
          {% for s in sessions %}
          <option value="{{ s.key }}">{{ s.key }} — {{ s.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <label class="form-label mb-0 small text-muted">📅 Date</label>
        <input type="date" id="date" class="form-control form-control-sm" style="width:auto" value="{{ today }}">
        <button id="todayBtn" class="btn btn-sm btn-outline-secondary">Today</button>
      </div>
    </div>

    <div id="modeBanner" class="container-fluid pb-2"></div>
  </header>

  <main class="container-fluid py-3">
    <ul class="nav nav-tabs" id="tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-tab="floor-house"   data-endpoint="/api/floor/house">House Floor</button></li>
      <li class="nav-item"><button class="nav-link"        data-tab="floor-senate"  data-endpoint="/api/floor/senate">Senate Floor</button></li>
      <li class="nav-item"><button class="nav-link"        data-tab="comm-house"    data-endpoint="/api/committees/house">House Committees</button></li>
      <li class="nav-item"><button class="nav-link"        data-tab="comm-senate"   data-endpoint="/api/committees/senate">Senate Committees</button></li>
      <li class="nav-item"><button class="nav-link"        data-tab="comm-joint"    data-endpoint="/api/committees/joint">Joint Committees</button></li>
      <li class="nav-item"><button class="nav-link ms-lg-3" data-tab="stats"        data-endpoint="/api/stats">📊 Session Stats</button></li>
      <li class="nav-item"><button class="nav-link"        data-tab="search">🔍 Topic Search</button></li>
      <li class="nav-item"><button class="nav-link"        data-tab="sponsors">👤 Sponsors</button></li>
    </ul>

    <div class="tab-body border border-top-0 rounded-bottom p-3" id="tabBody">
      <div class="text-muted">Loading…</div>
    </div>
  </main>

  <div class="legend container-fluid pb-4 small text-muted">
    <strong>Flags:</strong>
    🔴 25+ testimonies &nbsp;·&nbsp; ⚠️ Partisan committee vote &nbsp;·&nbsp; ✅ Bipartisan &nbsp;·&nbsp; 🔵 Floor split (a member crossed party lines)
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  const state = {
    session: document.getElementById('session').value,
    date: document.getElementById('date').value,
    today: "{{ today }}",
    activeTab: 'floor-house',
    cache: {},            // key: tab|session|date -> data
    lastFetch: {},        // key -> timestamp
    resolved: null,       // {session, name} reported by the last fetch (for Auto mode)
    sponsor: { kind: 'legislator', code: '', mode: 'first', data: null },
  };

  const tabBody = document.getElementById('tabBody');
  const tabs = [...document.querySelectorAll('#tabs .nav-link')];
  const tabMeta = {};
  tabs.forEach(t => tabMeta[t.dataset.tab] = t.dataset.endpoint);

  const isToday = () => state.date === state.today;
  const cacheKey = tab => `${tab}|${state.session}|${state.date}`;

  // ── formatting helpers ──────────────────────────────────────────────
  function fmtTime(hhmm) {
    if (!hhmm) return '';
    let [h, m] = hhmm.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,'0')} ${ap}`;
  }
  function fmtDate(iso) {
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined,
      {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  }
  function esc(s){ return (s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function flagBadges(flags) {
    if (!flags || !flags.length) return '';
    return flags.map(f =>
      `<span class="badge rounded-pill text-bg-${f.color} flag-badge">${f.icon||''} ${esc(f.label)}</span>`
    ).join(' ');
  }

  function billRow(b) {
    return `<tr class="bill-row" data-prefix="${esc(b.prefix)}" data-number="${b.number}">
      <td class="text-nowrap"><span class="bd-caret">▶</span> <a href="${b.url}" target="_blank" rel="noopener">${esc(b.bill)}</a></td>
      <td>${esc(b.catchline)}</td>
      <td class="text-nowrap">${esc(b.action)}</td>
      <td class="text-nowrap">${esc(b.sponsor)}</td>
      <td>${flagBadges(b.flags)}</td>
    </tr>`;
  }

  function fmtDate2(iso) {
    if (!iso) return '';
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  }

  const PASS_RESULTS = new Set(['Passed','Adopted','Do pass']);

  function renderBillDetail(data) {
    const parts = [];
    if (data.votes.length) {
      const rows = data.votes.map(v => {
        const res = v.result
          ? `<span class="badge ${PASS_RESULTS.has(v.result)?'text-bg-success':'text-bg-secondary'}">${esc(v.result)}</span>` : '';
        const nays = v.nayNames.length
          ? `<div class="small text-muted">No: ${v.nayNames.map(esc).join(', ')}</div>` : '';
        return `<div class="bd-vote">
          <div><span class="fw-semibold">${esc(v.where)}</span>
            <span class="text-muted small ms-1">${fmtDate2(v.date)}</span>
            <span class="badge text-bg-light text-dark ms-1">${esc(v.version)}</span> ${res}</div>
          <div class="small">Aye ${v.aye} · Nay ${v.nay}${v.excused?` · Excused ${v.excused}`:''}
            <span class="text-muted">(D ${v.dAye}-${v.dNay} · R ${v.rAye}-${v.rNay})</span></div>
          ${nays}
        </div>`;
      }).join('');
      parts.push(`<div class="bd-section"><div class="bd-head">Votes</div>${rows}</div>`);
    } else {
      parts.push(`<div class="bd-section"><div class="bd-head">Votes</div><div class="text-muted small">No recorded votes yet.</div></div>`);
    }
    const t = data.testimony;
    if (t.total) {
      const summary = `<div class="small text-muted mb-2">${t.total} submissions —
        <span class="text-success">${t.byPosition.Support} support</span> ·
        <span class="text-danger">${t.byPosition.Oppose} oppose</span> ·
        ${t.byPosition.Neutral} neutral</div>`;
      const posLine = (h, p) => {
        const d = h.positions[p];
        if (!d.count) return '';
        const cls = {Support:'text-success', Oppose:'text-danger', Neutral:'text-muted'}[p];
        const orgs = d.orgs.slice(0, 30).map(o =>
          `<span class="org-chip">${esc(o.name)}${o.count>1?` ${o.count}`:''}</span>`).join(' ');
        const more = d.orgs.length > 30 ? ' …' : '';
        const others = d.others
          ? `<span class="text-muted others-count" title="${esc((d.otherSamples||[]).join('  ·  ') || 'no named affiliation')}">${d.orgs.length?' + ':''}${d.others} individual${d.others===1?'':'s'}/other</span>`
          : '';
        const body = d.orgs.length ? `${orgs}${more}${others}` : (others || '<span class="text-muted">—</span>');
        return `<div class="bd-pos"><span class="${cls} fw-semibold">${p} (${d.count}):</span> <span class="small">${body}</span></div>`;
      };
      const hRows = t.hearings.map(h => `<div class="bd-hearing">
        <div><span class="fw-semibold">${esc(h.where)}</span>
          <span class="text-muted small ms-1">${fmtDate2(h.date)}</span>
          <span class="badge text-bg-light text-dark ms-1">${esc(h.version)}</span></div>
        ${posLine(h,'Support')}${posLine(h,'Oppose')}${posLine(h,'Neutral')}
      </div>`).join('');
      parts.push(`<div class="bd-section"><div class="bd-head">Testimony</div>${summary}${hRows}
        <div class="bd-caveat">⚠ Named organizations are matched against a curated list plus the lobbyist-client registry (~1,000 groups). Cities, individuals, and campaign slogans fold into the "individuals/other" count (hover it for a sample). Position, date, and version are exact.</div></div>`);
    } else {
      parts.push(`<div class="bd-section"><div class="bd-head">Testimony</div><div class="text-muted small">No public testimony recorded.</div></div>`);
    }
    if (data.versions.length) {
      const links = data.versions.map(v => `<a href="${v.url}" target="_blank" rel="noopener">${esc(v.name)}</a>`).join(' · ');
      parts.push(`<div class="bd-section"><div class="bd-head">Versions</div><div class="small">${links}</div></div>`);
    }
    return `<div class="bd-grid">${parts.join('')}</div>`;
  }

  // expand/collapse a bill row to show its vote + testimony history
  tabBody.addEventListener('click', async e => {
    if (e.target.closest('a')) return;            // let bill links work
    const row = e.target.closest('.bill-row');
    if (!row) return;
    const caret = row.querySelector('.bd-caret');
    const next = row.nextElementSibling;
    if (next && next.classList.contains('bill-detail-row')) {
      next.remove(); caret.textContent = '▶'; row.classList.remove('open');
      return;
    }
    caret.textContent = '▼'; row.classList.add('open');
    const detail = document.createElement('tr');
    detail.className = 'bill-detail-row';
    detail.innerHTML = `<td colspan="5"><div class="bill-detail">
      <div class="text-muted small p-2"><span class="spinner-border spinner-border-sm"></span> Loading vote &amp; testimony history…</div></div></td>`;
    row.after(detail);
    try {
      const r = await fetch(`/api/bill/${encodeURIComponent(row.dataset.prefix)}/${row.dataset.number}?session=${state.session}&date=${state.date}`);
      const data = await r.json();
      detail.querySelector('.bill-detail').innerHTML = data.error
        ? `<div class="alert alert-warning m-2">${esc(data.error)}</div>` : renderBillDetail(data);
    } catch (err) {
      console.error(err);
      detail.querySelector('.bill-detail').innerHTML = `<div class="alert alert-warning m-2">Could not load bill history.</div>`;
    }
  });

  function billTable(bills) {
    if (!bills.length) return '';
    return `<div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0">
      <thead><tr><th>Bill</th><th>Catchline</th><th>Action</th><th>Sponsor</th><th>Flags</th></tr></thead>
      <tbody>${bills.map(billRow).join('')}</tbody></table></div>`;
  }

  // ── mode banner ─────────────────────────────────────────────────────
  function sessionTag() {
    // When the session is auto-resolved from the date, show which one it landed on.
    if (state.session !== 'auto' || !state.resolved) return '';
    return `<span class="text-muted small ms-2">Session: ${esc(state.resolved.name || state.resolved.session)}</span>`;
  }

  function renderBanner() {
    const el = document.getElementById('modeBanner');
    if (state.activeTab === 'search') {
      el.innerHTML = `<span class="badge text-bg-dark">🔍 Topic search</span><span class="text-muted small ms-2">committee agendas, all sessions</span>`;
      return;
    }
    if (state.activeTab === 'sponsors') {
      el.innerHTML = `<span class="badge text-bg-dark">👤 Sponsor search</span><span class="text-muted small ms-2">bills by sponsor — session-wide</span>`;
      return;
    }
    if (state.activeTab === 'stats') {
      const name = state.resolved ? (state.resolved.name || state.resolved.session) : '';
      el.innerHTML = `<span class="badge text-bg-dark">📊 Session statistics</span>` +
        (name ? `<span class="text-muted small ms-2">${esc(name)}</span>` : '');
      return;
    }
    const cmp = state.date < state.today ? 'past' : (state.date > state.today ? 'future' : 'today');
    if (cmp === 'today') {
      const t = state.lastFetch[cacheKey(state.activeTab)];
      const ago = t ? Math.round((Date.now()-t)/60000) : 0;
      el.innerHTML = `<span class="badge text-bg-success">● Live</span>
        <span class="text-muted small ms-2">updated ${ago===0?'just now':ago+' min ago'}</span>` + sessionTag();
    } else {
      const label = cmp === 'future' ? 'upcoming' : 'historical';
      const cls = cmp === 'future' ? 'text-bg-primary' : 'text-bg-secondary';
      el.innerHTML = `<span class="badge ${cls}">Viewing: ${fmtDate(state.date)} (${label})</span>` + sessionTag();
    }
  }

  // ── rendering: floor ────────────────────────────────────────────────
  function renderFloor(data) {
    if (data.error) return `<div class="alert alert-warning mb-0">${esc(data.error)}</div>`;
    if (!data.bills.length)
      return `<div class="text-muted py-4 text-center">No floor session scheduled.</div>`;
    const convene = data.convene_time
      ? `<div class="small text-muted mb-2">Convenes ${fmtTime(data.convene_time)}</div>` : '';
    return convene + billTable(data.bills);
  }

  // ── rendering: committees ───────────────────────────────────────────
  const SECTION = {active:'IN SESSION NOW', upcoming:'UPCOMING', concluded:'CONCLUDED', unknown:''};

  function countLabel(c) {
    if (c.bill_count > 0) return `${c.bill_count} bill${c.bill_count===1?'':'s'}`;
    if (c.item_count > 0) return `${c.item_count} item${c.item_count===1?'':'s'}`;
    return 'no agenda';
  }

  function topicsList(topics) {
    if (!topics || !topics.length) return '';
    const rows = topics.map(t => {
      let inner = '';
      if (t.title) inner += `<div class="topic-title">${esc(t.title)}</div>`;
      if (t.presenters && t.presenters.length)
        inner += `<ul class="presenter-list small text-muted mb-0">${t.presenters.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
      if (t.lines && t.lines.length) {
        const cls = t.title ? 'small text-muted' : '';
        inner += t.lines.map(l=>`<div class="${cls}">${esc(l)}</div>`).join('');
      }
      const kindBadge = (t.kind && t.kind !== 'Informational Meeting')
        ? `<span class="badge text-bg-light text-dark me-2">${esc(t.kind)}</span>` : '';
      return `<li class="list-group-item py-2">${kindBadge}${inner}</li>`;
    }).join('');
    return `<ul class="list-group list-group-flush agenda-topics">${rows}</ul>`;
  }

  function committeeCard(c) {
    const open = c.status === 'active';
    const time = c.start_time ? fmtTime(c.start_time) : '';
    const badge = c.status === 'active' ? '<span class="badge text-bg-success ms-2">IN SESSION</span>' : '';
    return `<div class="committee card mb-2 status-${c.status} ${open?'open':''}" data-code="${esc(c.code)}">
      <div class="card-header committee-head d-flex align-items-center" role="button">
        <span class="caret me-2">${open?'▼':'▶'}</span>
        <span class="fw-semibold">${esc(c.name)}</span>
        ${time?`<span class="text-muted small ms-2">${time}</span>`:''}
        ${c.room?`<span class="text-muted small ms-2">📍 ${esc(c.room)}</span>`:''}
        ${badge}
        <span class="badge text-bg-light text-dark ms-auto">${countLabel(c)}</span>
      </div>
      <div class="committee-body card-body p-0" ${open?'':'hidden'}>
        <div class="p-2 text-muted small">Loading agenda…</div>
      </div>
    </div>`;
  }

  function renderCommittees(data) {
    if (data.error) return `<div class="alert alert-warning mb-0">${esc(data.error)}</div>`;
    if (!data.committees.length)
      return `<div class="text-muted py-4 text-center">No committee meetings scheduled.</div>`;

    if (!data.grouped) {
      return data.committees.map(committeeCard).join('');
    }
    // grouped by status with section dividers
    let html = '';
    let lastSection = null;
    for (const c of data.committees) {
      if (c.status !== lastSection) {
        lastSection = c.status;
        if (SECTION[c.status]) html += `<div class="section-divider">${SECTION[c.status]}</div>`;
      }
      html += committeeCard(c);
    }
    return html;
  }

  // ── rendering: topic search ─────────────────────────────────────────
  function highlight(text, term) {
    const safe = esc(text);
    if (!term) return safe;
    const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp(t, 'ig'), m => `<mark>${m}</mark>`);
  }
  function searchUI() {
    const q = state.lastSearch ? esc(state.lastSearch.query || '') : '';
    return `<div class="search-wrap">
      <div class="input-group mb-3">
        <input id="topicSearch" class="form-control" placeholder="Search committee topics across all sessions — e.g. wildfire, housing, fentanyl" value="${q}">
        <button id="topicSearchBtn" class="btn btn-success">Search</button>
      </div>
      <div id="searchResults">${state.lastSearch ? renderSearchResults(state.lastSearch) : searchPrompt()}</div>
    </div>`;
  }
  function searchPrompt() {
    return `<div class="text-muted py-4 text-center">Type a topic and press Search to find committee agenda items across every session.</div>`;
  }
  function renderSearchResults(data) {
    if (data.error) return `<div class="alert alert-warning mb-0">${esc(data.error)}</div>`;
    if (!data.query) return searchPrompt();
    if (!data.meetings.length)
      return `<div class="text-muted py-4 text-center">No committee agendas mention “${esc(data.query)}”.</div>`;
    const head = `<div class="small text-muted mb-2">${data.total} matching agenda item${data.total===1?'':'s'} across ${data.meetings.length} meeting${data.meetings.length===1?'':'s'}${data.capped?' — showing the 1000 most recent':''}.</div>`;
    const hits = data.meetings.map(mt => {
      const items = mt.items.map(it => `<div class="hit-snippet">${it.bill?`<a href="${it.url}" target="_blank" rel="noopener">${esc(it.bill)}</a> — `:''}${highlight(it.snippet, data.query)}</div>`).join('');
      return `<div class="search-hit">
        <div class="hit-head"><span class="fw-semibold">${fmtDate2(mt.date)}</span> · ${esc(mt.committee)}
          <span class="badge text-bg-light text-dark ms-1">${esc(mt.session)}</span>
          ${mt.agendaUrl?`<a class="ms-2 small" href="${mt.agendaUrl}" target="_blank" rel="noopener">agenda ↗</a>`:''}</div>
        ${items}</div>`;
    }).join('');
    return head + hits;
  }
  async function runSearch() {
    const input = document.getElementById('topicSearch');
    const term = input ? input.value.trim() : '';
    const box = document.getElementById('searchResults');
    if (!term) { state.lastSearch = null; box.innerHTML = searchPrompt(); return; }
    box.innerHTML = `<div class="d-flex align-items-center gap-2 text-muted py-4 justify-content-center"><div class="spinner-border spinner-border-sm"></div> Searching all sessions…</div>`;
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(term)}`);
      const data = await r.json();
      state.lastSearch = data;
      box.innerHTML = renderSearchResults(data);
    } catch (e) {
      console.error(e);
      box.innerHTML = `<div class="alert alert-warning mb-0">Search failed — try again.</div>`;
    }
  }

  // ── rendering: sponsor search ───────────────────────────────────────
  const LEG_MODES = [
    ['first', 'First chief',  'primary sponsor — listed first'],
    ['chief', 'Chief',        'any chief sponsor'],
    ['any',   'All',          'chief or regular co-sponsor'],
  ];
  const CMTE_MODES = [
    ['introduced', 'Introduced by',  'the committee is the sponsor of record'],
    ['requested',  'At request of',  'introduced at the request of this committee'],
    ['any',        'All',            'either relationship'],
  ];
  const isCmte = () => state.sponsor.kind === 'committee';
  const sponsorModes = () => isCmte() ? CMTE_MODES : LEG_MODES;
  function defaultMode() { return isCmte() ? 'introduced' : 'first'; }
  function sponsorLegend() {
    return isCmte()
      ? `<b>Introduced by</b> = the committee is the sponsor of record; <b>At request of</b> = introduced at that committee's request (usually interim committee work); <b>All</b> = either.`
      : `<b>First chief</b> = the primary sponsor listed first on the bill; <b>Chief</b> = any chief sponsor; <b>All</b> includes regular co-sponsorships.`;
  }

  async function sponsorUI() {
    let roster = [], cmtes = [], sessName = '';
    try {
      const r = await fetch(`/api/legislators?session=${state.session}`);
      const d = await r.json();
      roster = d.legislators || []; cmtes = d.committees || []; sessName = d.session_name || '';
    } catch (e) { console.error(e); }
    const sel = state.sponsor.code, selKind = state.sponsor.kind;
    const legOpts = roster.map(l => `<option value="L:${esc(l.code)}"${(selKind==='legislator'&&l.code===sel)?' selected':''}>${esc(l.name||l.code)} (${esc(l.party)}-${esc(l.chamber==='House'?'H':'S')}${l.district?' '+esc(l.district):''}) — ${esc(l.code)}</option>`).join('');
    const cmteOpts = cmtes.map(c => `<option value="C:${esc(c.code)}"${(selKind==='committee'&&c.code===sel)?' selected':''}>${esc(c.name)} (${esc(c.code)}) — ${c.total} bill${c.total===1?'':'s'}</option>`).join('');
    const opts = `<option value="">Choose a legislator or committee…</option>
      <optgroup label="Legislators">${legOpts}</optgroup>
      <optgroup label="Committees (bills introduced by / at the request of)">${cmteOpts}</optgroup>`;
    const modeBtns = sponsorModes().map(([m, label, hint]) =>
      `<button class="btn btn-sm ${state.sponsor.mode===m?'btn-success':'btn-outline-secondary'} sponsor-mode" data-mode="${m}" title="${esc(hint)}">${label}<span class="mode-count" data-count="${m}"></span></button>`).join('');
    return `<div class="sponsor-wrap">
      <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
        <select id="sponsorPick" class="form-select" style="max-width:460px">${opts}</select>
        <div class="btn-group" role="group">${modeBtns}</div>
      </div>
      <div class="small text-muted mb-2">Sponsorships in <b>${esc(sessName)}</b>. <span id="sponsorLegend">${sponsorLegend()}</span></div>
      <div id="sponsorResults">${state.sponsor.data ? renderSponsorResults(state.sponsor.data) : '<div class="text-muted py-4 text-center">Pick a legislator or committee to see their bills.</div>'}</div>
    </div>`;
  }
  function roleBadge(role) {
    const cls = role === 'First chief' ? 'text-bg-success'
      : role === 'Chief' ? 'text-bg-primary'
      : role === 'Introduced by' ? 'text-bg-success'
      : role === 'At request of' ? 'text-bg-info'
      : 'text-bg-light text-dark';
    return `<span class="badge ${cls}">${esc(role)}</span>`;
  }
  function renderSponsorResults(data) {
    if (data.error) return `<div class="alert alert-warning mb-0">${esc(data.error)}</div>`;
    if (!data.code) return `<div class="text-muted py-4 text-center">Pick a legislator or committee to see their bills.</div>`;
    const who = data.name ? `${data.name} (${data.code})` : data.code;
    if (!data.bills.length)
      return `<div class="text-muted py-4 text-center">No bills for ${esc(who)} in this category.</div>`;
    const rows = data.bills.map(b => {
      const badges = String(b.role || '').split(' · ').filter(Boolean).map(roleBadge).join(' ');
      const req = b.requested_text ? `<div class="req-text small text-muted">${esc(b.requested_text)}</div>` : '';
      return `<tr>
        <td class="text-nowrap"><a href="${b.url}" target="_blank" rel="noopener">${esc(b.bill)}</a></td>
        <td>${esc(b.catchline)}${req}</td>
        <td class="text-nowrap">${badges}</td>
        <td class="small">${esc(b.status)}${b.chapter?` <span class="badge text-bg-dark">Ch. ${esc(String(b.chapter))}</span>`:''}</td>
      </tr>`;
    }).join('');
    return `<div class="small text-muted mb-2">${data.bills.length} bill${data.bills.length===1?'':'s'} — ${esc(who)}</div>
      <div class="table-responsive"><table class="table table-sm table-hover align-middle mb-0">
      <thead><tr><th>Bill</th><th>Catchline</th><th>Role</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  function paintSponsorCounts(counts) {
    for (const [m] of sponsorModes()) {
      const el = document.querySelector(`.mode-count[data-count="${m}"]`);
      if (el) el.textContent = counts && counts[m] != null ? ` ${counts[m]}` : '';
    }
  }
  async function runSponsorSearch() {
    const box = document.getElementById('sponsorResults');
    if (!state.sponsor.code) { state.sponsor.data = null; if (box) box.innerHTML = '<div class="text-muted py-4 text-center">Pick a legislator or committee to see their bills.</div>'; paintSponsorCounts(null); return; }
    if (box) box.innerHTML = `<div class="d-flex align-items-center gap-2 text-muted py-4 justify-content-center"><div class="spinner-border spinner-border-sm"></div> Loading sponsorships…</div>`;
    try {
      const url = isCmte()
        ? `/api/committee-bills/${encodeURIComponent(state.sponsor.code)}?session=${state.session}&mode=${state.sponsor.mode}`
        : `/api/sponsor?session=${state.session}&code=${encodeURIComponent(state.sponsor.code)}&mode=${state.sponsor.mode}`;
      const data = await (await fetch(url)).json();
      state.sponsor.data = data;
      document.getElementById('sponsorResults').innerHTML = renderSponsorResults(data);
      paintSponsorCounts(data.counts);
    } catch (e) {
      console.error(e);
      document.getElementById('sponsorResults').innerHTML = `<div class="alert alert-warning mb-0">Could not load sponsorships.</div>`;
    }
  }
  // repaint mode buttons + legend when switching between legislator and committee
  function refreshSponsorModes() {
    const group = document.querySelector('.sponsor-wrap .btn-group');
    if (group) group.innerHTML = sponsorModes().map(([m, label, hint]) =>
      `<button class="btn btn-sm ${state.sponsor.mode===m?'btn-success':'btn-outline-secondary'} sponsor-mode" data-mode="${m}" title="${esc(hint)}">${label}<span class="mode-count" data-count="${m}"></span></button>`).join('');
    const legend = document.getElementById('sponsorLegend');
    if (legend) legend.innerHTML = sponsorLegend();
  }

  // ── rendering: session stats ────────────────────────────────────────
  function renderStats(data) {
    if (data.error) return `<div class="alert alert-warning mb-0">${esc(data.error)}</div>`;
    const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
    const tile = (num, label, sub) =>
      `<div class="stat-tile"><div class="stat-num">${num}</div><div class="stat-label">${label}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div>`;
    const tiles = [
      tile(data.total, 'Measures introduced', 'all measure types'),
      tile(data.bills.passed, 'Bills passed both chambers', 'HB &amp; SB only'),
      tile(data.bills.bipartisan, 'Bipartisan bills', `${pct(data.bills.bipartisan, data.bills.passed)} of the ${data.bills.passed} bills`),
      tile(data.enacted, 'Measures enacted', 'signed into law'),
    ].join('');
    const legend = `<div class="stat-legend small text-muted mb-2"><b>Measures</b> = all types (bills, resolutions, memorials). <b>Bills</b> = HB &amp; SB only.</div>`;
    const passage = `<div class="bd-section"><div class="bd-head">Passage — all measures</div>
      <div class="stat-line"><b>${data.passedBoth}</b> measures passed both chambers</div>
      <div class="stat-line"><span class="dot text-success">●</span> ${data.bipartisan} bipartisan <span class="text-muted">(${pct(data.bipartisan, data.passedBoth)} of ${data.passedBoth})</span></div>
      <div class="stat-line"><span class="dot text-secondary">●</span> ${data.unanimousBoth} unanimous — no No votes in either chamber</div>
      <div class="stat-line"><span class="dot text-warning">●</span> ${data.partyLineAny} party-line in ≥1 chamber</div>
      <div class="stat-line text-muted">${data.passedOne} passed one chamber only</div></div>`;
    const max = Math.max(...data.byPrefix.map(p => p.count), 1);
    const bars = data.byPrefix.map(p =>
      `<div class="pfx-row"><span class="pfx-name">${esc(p.prefix)}</span><span class="pfx-track"><span class="pfx-bar" style="width:${Math.round(100*p.count/max)}%"></span></span><span class="pfx-count">${p.count}</span></div>`).join('');
    const byType = `<div class="bd-section"><div class="bd-head">Measures by type</div>${bars}</div>`;
    const caption = `<div class="bd-caveat">Bipartisan = at least one Democrat and one Republican voted Aye on final passage in <em>at least one</em> chamber. Party-line = every voting D one way and every voting R the other. Based on the latest floor roll call per chamber; "enacted" = has a chapter number.</div>`;
    return `<div class="stat-note text-muted small mb-2">Session-wide totals for <b>${esc(data.session_name)}</b> — the date filter doesn't apply to this tab.</div>
      ${legend}
      <div class="stat-tiles">${tiles}</div>
      <div class="bd-grid mt-3">${passage}${byType}</div>${caption}`;
  }

  // ── committee expand/collapse + lazy agenda load ────────────────────
  async function loadAgenda(card) {
    const body = card.querySelector('.committee-body');
    if (card.dataset.loaded) return;
    try {
      const r = await fetch(`/api/committee/${encodeURIComponent(card.dataset.code)}?session=${state.session}&date=${state.date}`);
      const data = await r.json();
      if (data.error) {
        body.innerHTML = `<div class="alert alert-warning m-2 mb-2">${esc(data.error)}</div>`;
      } else {
        const parts = [];
        if (data.bills && data.bills.length) parts.push(billTable(data.bills));
        if (data.topics && data.topics.length) parts.push(topicsList(data.topics));
        body.innerHTML = parts.length ? parts.join('') : `<div class="p-3 text-muted small">Nothing on the agenda.</div>`;
      }
      card.dataset.loaded = '1';
    } catch (e) {
      body.innerHTML = `<div class="alert alert-warning m-2">Could not load agenda.</div>`;
    }
  }

  tabBody.addEventListener('click', e => {
    const head = e.target.closest('.committee-head');
    if (!head) return;
    const card = head.closest('.committee');
    const body = card.querySelector('.committee-body');
    const caret = card.querySelector('.caret');
    const opening = body.hasAttribute('hidden');
    if (opening) { body.removeAttribute('hidden'); caret.textContent = '▼'; card.classList.add('open'); loadAgenda(card); }
    else { body.setAttribute('hidden',''); caret.textContent = '▶'; card.classList.remove('open'); }
  });

  // auto-load agendas for committees expanded by default (active ones)
  function autoLoadOpen() {
    tabBody.querySelectorAll('.committee.open').forEach(loadAgenda);
  }

  // ── tab loading ─────────────────────────────────────────────────────
  async function loadTab(tab, force=false) {
    if (tab === 'search') { renderBanner(); tabBody.innerHTML = searchUI(); return; }  // user-driven, no auto-fetch
    if (tab === 'sponsors') {
      renderBanner();
      tabBody.innerHTML = `<div class="d-flex align-items-center gap-2 text-muted py-4 justify-content-center"><div class="spinner-border spinner-border-sm"></div> Loading roster…</div>`;
      tabBody.innerHTML = await sponsorUI();
      paintSponsorCounts(state.sponsor.data ? state.sponsor.data.counts : null);
      return;
    }
    const key = cacheKey(tab);
    renderBanner();
    if (!force && state.cache[key]) { paint(tab, state.cache[key]); return; }

    tabBody.innerHTML = `<div class="d-flex align-items-center gap-2 text-muted py-4 justify-content-center">
      <div class="spinner-border spinner-border-sm"></div> Loading…</div>`;
    try {
      const r = await fetch(`${tabMeta[tab]}?session=${state.session}&date=${state.date}`);
      const data = await r.json();
      if (data.session) state.resolved = {session: data.session, name: data.session_name};
      state.cache[key] = data;
      state.lastFetch[key] = Date.now();
      paint(tab, data);
    } catch (e) {
      tabBody.innerHTML = `<div class="alert alert-warning mb-0">Data unavailable — try refreshing.</div>`;
    }
    renderBanner();
  }

  function paint(tab, data) {
    if (state.activeTab !== tab) return;
    if (tab === 'stats') tabBody.innerHTML = renderStats(data);
    else if (tab.startsWith('floor')) tabBody.innerHTML = renderFloor(data);
    else { tabBody.innerHTML = renderCommittees(data); autoLoadOpen(); }
  }

  // ── events ──────────────────────────────────────────────────────────
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.activeTab = t.dataset.tab;
    loadTab(state.activeTab);
  }));

  function resetAndReload() {
    state.cache = {};
    state.session = document.getElementById('session').value;
    state.date = document.getElementById('date').value;
    loadTab(state.activeTab, true);
  }

  document.getElementById('session').addEventListener('change', resetAndReload);
  document.getElementById('date').addEventListener('change', resetAndReload);
  document.getElementById('todayBtn').addEventListener('click', () => {
    document.getElementById('date').value = state.today;
    resetAndReload();
  });

  // topic search (box is injected into tabBody, so delegate)
  tabBody.addEventListener('click', e => { if (e.target.id === 'topicSearchBtn') runSearch(); });
  tabBody.addEventListener('keydown', e => { if (e.target.id === 'topicSearch' && e.key === 'Enter') { e.preventDefault(); runSearch(); } });

  // sponsor search (controls are injected into tabBody, so delegate)
  tabBody.addEventListener('change', e => {
    if (e.target.id !== 'sponsorPick') return;
    const v = e.target.value;                    // "L:<code>" | "C:<code>" | ""
    const wasCmte = state.sponsor.kind === 'committee';
    state.sponsor.kind = v.startsWith('C:') ? 'committee' : 'legislator';
    state.sponsor.code = v.slice(2);
    if (wasCmte !== (state.sponsor.kind === 'committee')) {
      state.sponsor.mode = defaultMode();        // mode sets differ by kind
      refreshSponsorModes();
    }
    runSponsorSearch();
  });
  tabBody.addEventListener('click', e => {
    const btn = e.target.closest('.sponsor-mode');
    if (!btn) return;
    state.sponsor.mode = btn.dataset.mode;
    document.querySelectorAll('.sponsor-mode').forEach(b => {
      const on = b.dataset.mode === state.sponsor.mode;
      b.classList.toggle('btn-success', on);
      b.classList.toggle('btn-outline-secondary', !on);
    });
    runSponsorSearch();
  });

  // auto-refresh committee tabs every 5 minutes when viewing today
  setInterval(() => {
    if (isToday() && state.activeTab.startsWith('comm')) loadTab(state.activeTab, true);
    else renderBanner();
  }, 5 * 60 * 1000);

  // initial load
  loadTab(state.activeTab);
  </script>
</body>
</html>
